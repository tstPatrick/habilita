<body>
<style>
/* Layout: coluna única de 460px para o aluno (celular primeiro); painel do instrutor até 1000px. Marca Habilita: azul-noite + verde visto. */
:root{
  --bg:#F4F7FA; --surface:#FFFFFF; --fg:#0D2240; --muted:#4A5B70; --line:#DCE4EC; --ctl:#7A8CA1; --tile:#EAF0F6;
  --action:#0B7F54; --action-fg:#FFFFFF; --mark:#12A06B; --bar:#0D2240; --navy:#0D2240; --navy-fg:#FFFFFF;
  --ok-bg:#DDF3E6; --ok-ink:#14633A; --nc-bg:#FDE8E6; --nc-ink:#B42318; --nc-deep:#8F1B12;
  --na-bg:#E4EBF2; --na-ink:#475467; --warn-bg:#FFF1CF; --warn-ink:#7A5200; --seg-off:#DCE4EC;
  --shadow:0 1px 2px rgba(13,34,64,.14);
  --f:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A111D; --surface:#121C2E; --fg:#E8EDF5; --muted:#9FB0C6; --line:#25324A; --ctl:#6B7F99; --tile:#1A2740;
  --action:#1DBF84; --action-fg:#04271B; --mark:#1DBF84; --bar:#FFFFFF; --navy:#16294A; --navy-fg:#FFFFFF;
  --ok-bg:#10301D; --ok-ink:#7FE0A5; --nc-bg:#3A1717; --nc-ink:#FF9C9C; --nc-deep:#FFB4AB;
  --na-bg:#222E42; --na-ink:#B7C3D6; --warn-bg:#3A2D0E; --warn-ink:#F4CF7A; --seg-off:#25324A;
  --shadow:0 1px 2px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A111D; --surface:#121C2E; --fg:#E8EDF5; --muted:#9FB0C6; --line:#25324A; --ctl:#6B7F99; --tile:#1A2740;
  --action:#1DBF84; --action-fg:#04271B; --mark:#1DBF84; --bar:#FFFFFF; --navy:#16294A; --navy-fg:#FFFFFF;
  --ok-bg:#10301D; --ok-ink:#7FE0A5; --nc-bg:#3A1717; --nc-ink:#FF9C9C; --nc-deep:#FFB4AB;
  --na-bg:#222E42; --na-ink:#B7C3D6; --warn-bg:#3A2D0E; --warn-ink:#F4CF7A; --seg-off:#25324A;
  --shadow:0 1px 2px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);font-size:16px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 32px}
h1,h2,h3,p{margin:0}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.12;text-wrap:balance}
h2{font-size:19px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
h3{font-size:16px;font-weight:800}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--action);outline-offset:2px}
.col{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.col.wide{max-width:1000px}
.col>*{min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.brandrow{display:flex;align-items:center;gap:10px}
.wm{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1}
.wm.big{font-size:40px}
.lb{stroke:var(--bar);stroke-width:8;stroke-linecap:round;fill:none}
.lc{stroke:var(--mark);stroke-width:8;stroke-linecap:round;stroke-linejoin:round;fill:none}
.foot{text-align:center;font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--muted);padding-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.card.flat{gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1.5px solid transparent;font-weight:700;font-size:15px;line-height:1.1;text-align:center}
.btn.pri{background:var(--action);color:var(--action-fg)}
.btn.dark{background:var(--navy);color:var(--navy-fg)}
.btn.out{background:var(--surface);border-color:var(--ctl);color:var(--fg);font-weight:600}
.btn.link{background:transparent;color:var(--action);min-height:44px}
.btn.sm{min-height:40px;padding:0 12px;font-size:14px}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.back{border:0;background:none;padding:6px 0;min-height:40px;color:var(--muted);font-weight:700;text-align:left;align-self:flex-start}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700;white-space:nowrap;line-height:1.2}
.pill.ok{background:var(--ok-bg);color:var(--ok-ink)} .pill.nc{background:var(--nc-bg);color:var(--nc-ink)}
.pill.na{background:var(--na-bg);color:var(--na-ink)} .pill.warn{background:var(--warn-bg);color:var(--warn-ink)}
.fld{display:flex;flex-direction:column;gap:8px}
.fld label,.lb2{font-size:14px;font-weight:700}
input[type=text],input[type=password],textarea,select{width:100%;min-height:50px;border:1.5px solid var(--ctl);border-radius:12px;padding:0 14px;font-size:16px;font-weight:500;background:var(--surface);color:var(--fg)}
textarea{padding:12px 14px;min-height:96px;resize:vertical;line-height:1.5}
.err{background:var(--nc-bg);color:var(--nc-deep);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600}
.tip{background:var(--tile);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.45}
.tip.warn{background:var(--warn-bg);color:var(--warn-ink);font-weight:600}
.seg2{display:flex;background:var(--tile);border-radius:12px;padding:4px}
.seg2 button{flex:1;min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:600;font-size:15px}
.seg2 button[aria-selected="true"]{background:var(--surface);color:var(--fg);font-weight:700;box-shadow:var(--shadow)}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);overflow-x:auto;max-width:100%}
.tabs button{min-height:44px;padding:0 12px;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;background:none;color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);font-weight:700;border-bottom-color:var(--action)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border:1.5px solid var(--ctl);border-radius:99px;background:var(--surface);font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{border:2px solid var(--action);background:var(--ok-bg);color:var(--ok-ink);font-weight:700}
.tag{background:var(--tile);border-radius:8px;padding:4px 10px;font-size:14px;font-weight:500}
ul.clean{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.segbar{display:flex;gap:4px}
.segbar i{flex:1;height:6px;border-radius:3px;background:var(--seg-off)}
.segbar i.ok{background:var(--action)} .segbar i.nc{background:var(--nc-ink)} .segbar i.na{background:var(--ctl)}
.segbar i.cur{outline:2px solid var(--fg);outline-offset:1px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;min-height:56px;width:100%;border:1.5px solid var(--ctl);border-radius:14px;background:var(--surface);padding:10px 16px;font-size:16px;font-weight:600;text-align:left}
.opt .dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--ctl);flex:none;display:flex;align-items:center;justify-content:center}
.opt[aria-pressed="true"]{font-weight:700}
.opt.ok[aria-pressed="true"]{background:var(--ok-bg);border:2px solid var(--ok-ink);color:var(--ok-ink)}
.opt.ok[aria-pressed="true"] .dot{background:var(--ok-ink);border-color:var(--ok-ink)}
.opt.nc[aria-pressed="true"]{background:var(--nc-bg);border:2px solid var(--nc-ink);color:var(--nc-ink)}
.opt.nc[aria-pressed="true"] .dot{background:var(--nc-ink);border-color:var(--nc-ink)}
.opt.na[aria-pressed="true"]{background:var(--na-bg);border:2px solid var(--na-ink);color:var(--na-ink)}
.opt.na[aria-pressed="true"] .dot{background:var(--na-ink);border-color:var(--na-ink)}
.opt.sel[aria-pressed="true"]{background:var(--tile);border:2px solid var(--action)}
.opt.sel[aria-pressed="true"] .dot{background:var(--action);border-color:var(--action)}
.opt.right{background:var(--ok-bg);border:2px solid var(--ok-ink);color:var(--ok-ink)}
.opt.wrong{background:var(--nc-bg);border:2px solid var(--nc-ink);color:var(--nc-ink)}
.dot svg{display:block}
.qblock{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.qblock:first-of-type{border-top:0;padding-top:0}
.qt{font-weight:700;line-height:1.35}
.bar{position:sticky;bottom:0;margin:0 -16px -16px;border-radius:0 0 16px 16px;background:var(--surface);border-top:1px solid var(--line);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:12px}
.banner{border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:10px}
.banner.ok{background:var(--ok-bg);color:var(--ok-ink)} .banner.nc{background:var(--nc-bg);color:var(--nc-deep)}
.banner h1{font-size:30px}
.banner .ico{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.banner.ok .ico{background:var(--ok-ink)} .banner.nc .ico{background:var(--nc-ink)}
.counts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.count{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 12px;display:flex;flex-direction:column;gap:2px}
.count b{font-size:28px;font-weight:800;line-height:1}
.count span{font-size:12px;font-weight:600;color:var(--muted)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);max-width:100%}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
th{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--bg)}
tr:last-child td{border-bottom:0}
.cellbtn{border:0;background:none;padding:0;min-height:40px}
.edit{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:center}
.edit .n{font-size:13px;font-weight:700;color:var(--muted);text-align:center}
.tools{display:flex;gap:6px}
.tools .btn{min-width:44px;padding:0 10px}
details.mach{border:1px solid var(--line);border-radius:14px;background:var(--surface)}
details.mach>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:800;min-height:56px}
details.mach>summary::-webkit-details-marker{display:none}
details.mach>summary::after{content:"›";font-size:22px;color:var(--muted);transform:rotate(90deg);transition:transform .15s}
details.mach[open]>summary::after{transform:rotate(-90deg)}
.mbody{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px}
.qedit{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.oedit{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center}
.oedit input[type=radio]{width:22px;height:22px;accent-color:var(--action)}
.oedit input[type=text]{min-height:44px}
.qr{background:#fff;border-radius:12px;padding:10px;width:200px;max-width:100%}
.qr svg{display:block;width:100%;height:auto}
.rec{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:8px}
.rec details summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);min-height:36px;display:flex;align-items:center}
.rec ul{margin:6px 0 0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.empty{background:var(--surface);border:1.5px dashed var(--ctl);border-radius:14px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:10px;font-weight:600;font-size:14px;z-index:60;max-width:90vw;text-align:center}
.splash{position:fixed;inset:0;z-index:50;background:#0D2240;display:flex;flex-direction:column;align-items:center;padding:0 32px calc(44px + env(safe-area-inset-bottom,0px));animation:splashOut .5s ease 1.1s forwards}
.splash .mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.splash .lb{stroke:#fff} .splash .lc{stroke:#12A06B}
.splash .nm{font-size:48px;font-weight:800;letter-spacing:-.03em;line-height:1;color:#fff}
.splash p{margin:0;font-size:15px;line-height:1.5;color:#B8C7DB;text-align:center;max-width:260px;text-wrap:balance}
.splash .by{font-size:13px;font-weight:600;letter-spacing:.08em;color:#B8C7DB}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){.splash{display:none}details.mach>summary::after{transition:none}}
@media (max-width:520px){h1{font-size:26px}}
</style>

<div id="toast" class="toast" role="status" hidden></div>

var Store=(function(){
  var impl=null;
  function mkLocal(){
    var KEY='habilita:dados:v1', docs={}, ws=[];
    try{docs=JSON.parse(lsGet(KEY)||'{}')||{}}catch(e){docs={}}
    function snap(path){
      if(path.indexOf('/')>-1){var d=docs[path];return d?Object.assign({id:path.split('/')[1]},d):null}
      return Object.keys(docs).filter(function(k){return k.indexOf(path+'/')===0}).map(function(k){return Object.assign({id:k.slice(path.length+1)},docs[k])});
    }
    function fire(){ws.forEach(function(w){w.cb(snap(w.path))})}
    function save(){lsSet(KEY,JSON.stringify(docs))}
    window.addEventListener('storage',function(e){if(e.key===KEY){try{docs=JSON.parse(e.newValue||'{}')||{}}catch(_){docs={}}fire()}});
    return {mode:'local',
      watch:function(path,cb){var w={path:path,cb:cb};ws.push(w);setTimeout(function(){cb(snap(path))},0);return function(){ws=ws.filter(function(x){return x!==w})}},
      set:function(path,data){docs[path]=JSON.parse(JSON.stringify(data));save();fire();return Promise.resolve()},
      del:function(path){delete docs[path];save();fire();return Promise.resolve()}};
  }
  function mkDb(db){
    return {mode:'db',
      watch:function(path,cb){
        var isDoc=path.split('/').length%2===0;
        var err=function(e){console.warn('db',e&&e.code)};
        if(isDoc) return db.doc(path).onSnapshot(function(s){cb(s.exists?Object.assign({id:s.id},s.data()):null)},err);
        return db.collection(path).onSnapshot(function(s){cb(s.docs.map(function(d){return Object.assign({id:d.id},d.data())}))},err);
      },
      set:function(path,data){return db.doc(path).set(JSON.parse(JSON.stringify(data)))},
      del:function(path){return db.doc(path).delete()}};
  }
  return {
    init:function(){
      var p=(window.claude&&typeof window.claude.use==='function')?window.claude.use('db'):Promise.resolve(null);
      return Promise.race([p,new Promise(function(r){setTimeout(function(){r(null)},8000)})]).catch(function(){return null}).then(function(db){impl=db?mkDb(db):mkLocal();return impl.mode});
    },
    watch:function(p,cb){return impl.watch(p,cb)},
    set:function(p,d){return impl.set(p,d)},
    del:function(p){return impl.del(p)},
    mode:function(){return impl&&impl.mode}
  };
})();

function cfg(){var d=S.cfgDoc||{};return {
  machines:d.machines||DEF_MACHINES, checks:d.checks||DEF_CHECKS,
  admins:d.admins||[{id:'a1',nome:'Administrador',user:'admin',pw:DEF_HASH}],
  appUrl:d.appUrl||'', lab:d.lab||'Laboratório Maker'}}
function mach(id){return cfg().machines.find(function(m){return m.id===id})}
function me(){return S.students.find(function(s){return s.id===S.sess.s})}
function adm(){return cfg().admins.find(function(a){return a.id===S.sess.a})}
function openNC(mid){return S.records.filter(function(r){return r.mid===mid&&r.nc>0&&!r.resolvido})}
function saveSess(){lsSet('habilita:sessao',JSON.stringify(S.sess))}
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){e.hidden=true},2400)}
function setErr(m){S.err=m;render()}

function saveCfg(patch){var c=Object.assign({},cfg(),patch);S.cfgDoc=c;return Store.set('config/main',c)}
function putStudent(st){st=Object.assign({},st);S.students=S.students.map(function(x){return x.id===st.id?st:x});return Store.set('students/'+st.id,st)}
function putRecord(r){S.records=[r].concat(S.records.filter(function(x){return x.id!==r.id}));return Store.set('records/'+r.id,r)}
function guard(p){return Promise.resolve(p).catch(function(e){console.warn(e);toast('Não foi possível salvar. Tente de novo.')})}

function list(t,arr){return '<div class="card flat"><h3>'+t+'</h3>'+(arr&&arr.length?'<ul class="clean">'+arr.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>':'<p class="muted small">O instrutor ainda não preencheu esta parte.</p>')+'</div>'}
function vTreino(m,h){
  var epis='<div class="card flat"><h3>EPIs obrigatórios</h3>'+(m.epis&&m.epis.length?'<div class="chips">'+m.epis.map(function(x){return '<span class="tag">'+esc(x)+'</span>'}).join('')+'</div>':'<p class="muted small">O instrutor ainda não preencheu esta parte.</p>')+'</div>';
  var tail;
  if(S.quiz&&S.quiz.mid===m.id) tail=vQuiz(m);
  else if(h) tail='<div class="banner ok"><h2>Você está habilitado</h2><p>Habilitação registrada em '+esc(h)+'. Pode fazer o checklist antes de usar a máquina.</p><div><button class="btn pri" data-act="open" data-v="'+esc(m.id)+'" data-t="check">Ir para o checklist</button></div></div>';
  else if(!m.quiz||!m.quiz.length) tail='<div class="tip warn">Esta máquina ainda não tem quiz. Fale com o instrutor para ser habilitado.</div>';
  else tail='<div class="card"><div class="stack"><h3>Quiz de habilitação</h3><p class="muted small">'+m.quiz.length+' pergunta'+(m.quiz.length>1?'s':'')+'. Acertando '+need(m)+' ou mais, você fica habilitado nesta máquina.</p></div><button class="btn pri full" data-act="qstart">Começar quiz</button></div>';
  return list('Como funciona',m.como)+list('Riscos',m.riscos)+epis+tail;
}
function need(m){return Math.ceil(m.quiz.length*2/3)}
function vQuiz(m){
  var q=S.quiz,res=S.qres,n=Object.keys(q.ans).length;
  var blocks=m.quiz.map(function(it,i){
    var opts=it.o.map(function(t,j){return {t:t,j:j}}).filter(function(x){return String(x.t).trim()});
    return '<div class="qblock" role="group" aria-label="Pergunta '+(i+1)+'"><p class="qt">'+(i+1)+'. '+esc(it.q)+'</p><div class="opts">'+opts.map(function(x){
      var cls='opt sel',sel=q.ans[i]===x.j;
      if(res){cls='opt';if(x.j===it.a)cls+=' right';else if(sel)cls+=' wrong'}
      return '<button class="'+cls+'" aria-pressed="'+sel+'" '+(res?'disabled':'')+' data-act="qans" data-q="'+i+'" data-v="'+x.j+'"><span class="dot"></span>'+esc(x.t)+'</button>'}).join('')+'</div></div>';
  }).join('');
  var foot2;
  if(!res) foot2='<div class="row"><span class="small muted">'+n+' de '+m.quiz.length+' respondidas</span><button class="btn pri" '+(n<m.quiz.length?'disabled':'')+' data-act="qsubmit">Enviar respostas</button></div>';
  else if(res.pass) foot2='<div class="banner ok"><h2>Habilitado! '+res.score+' de '+m.quiz.length+' certas</h2><p>Você já pode fazer o checklist desta máquina.</p><div><button class="btn pri" data-act="open" data-v="'+esc(m.id)+'" data-t="check">Ir para o checklist</button></div></div>';
  else foot2='<div class="banner nc"><h2>Ainda não deu: '+res.score+' de '+m.quiz.length+'</h2><p>Releia os riscos e os EPIs acima e tente de novo.</p><div><button class="btn out" data-act="qstart">Tentar novamente</button></div></div>';
  return '<div class="card"><h3>Quiz de habilitação</h3>'+blocks+foot2+'</div>';
}

function vCheck(m,h){
  if(!h) return '<div class="card flat"><h3>Checklist bloqueado</h3><p class="muted">Para fazer o checklist, primeiro conclua o treinamento e passe no quiz desta máquina.</p><div><button class="btn pri" data-act="tab" data-v="treino">Ir para o treinamento</button></div></div>';
  var items=cfg().checks[m.id]||[];
  if(!items.length) return '<div class="card"><p class="muted">O instrutor ainda não cadastrou perguntas para esta máquina.</p></div>';
  var c=S.chk;
  if(!c||c.mid!==m.id){
    var nc=openNC(m.id).length;
    return '<div class="card"><div class="stack"><h3>Checklist pré-uso</h3><p class="muted small">'+items.length+' perguntas. Responda Conforme, Não conforme ou Não se aplica antes de usar a máquina.</p></div>'+(nc?'<div class="tip warn">Há '+nc+' pendência'+(nc>1?'s':'')+' aberta'+(nc>1?'s':'')+' nesta máquina. Fale com o instrutor.</div>':'')+'<button class="btn pri full" data-act="cstart">Iniciar checklist</button></div>';
  }
  var it=items[c.idx],a=c.ans[it.id],last=c.idx===items.length-1;
  var nOk=0,nNc=0;items.forEach(function(x){if(c.ans[x.id]==='nc')nNc++});
  var seg=items.map(function(x,k){var r=c.ans[x.id];return '<i class="'+(r||'')+(k===c.idx?' cur':'')+'"></i>'}).join('');
  function opt(k,label,icon){var on=a===k;return '<button class="opt '+k+'" aria-pressed="'+on+'" data-act="ans" data-v="'+k+'"><span class="dot">'+(on?icon:'')+'</span>'+label+'</button>'}
  var canNext=!!a&&(a!=='nc'||(c.obs[it.id]||'').trim().length>0);
  return '<div class="stack"><div class="row"><span class="small muted" style="font-weight:700">Pergunta '+(c.idx+1)+' de '+items.length+'</span>'+(nNc?'<span class="small" style="font-weight:700;color:var(--nc-ink)">'+nNc+' não conforme</span>':'')+'</div><div class="segbar" aria-hidden="true">'+seg+'</div></div>'+
   '<div class="card"><h2 style="font-size:22px;line-height:1.3">'+(c.idx+1)+'. '+esc(it.t)+'</h2><div class="opts" role="group" aria-label="Resposta">'+opt('ok','Conforme',CKICON)+opt('nc','Não conforme',XICON)+opt('na','Não se aplica',CKICON.replace('M5 12l5 5L20 7','M6 12h12'))+'</div>'+
   (a==='nc'?'<div class="fld"><label for="obs">O que está errado? <span class="muted" style="font-weight:500">(obrigatório)</span></label><textarea id="obs" data-f="obs" placeholder="Descreva o problema encontrado">'+esc(c.obs[it.id]||'')+'</textarea></div>':'')+
   '<div class="bar"><button class="btn out" style="flex:1" data-act="cprev" '+(c.idx===0?'disabled':'')+'>Anterior</button><button class="btn pri" id="cnext" style="flex:1.4" data-act="'+(last?'cfinish':'cnext')+'" '+(canNext?'':'disabled')+'>'+(last?'Finalizar':'Próxima')+'</button></div></div>';
}

  if(!ms.length) return '<div class="empty"><p class="muted">Cadastre uma máquina na aba Máquinas para criar o checklist dela.</p></div>';
  var mid=curMach(),items=c.checks[mid]||[];
  return '<div class="chips" role="group" aria-label="Máquina">'+ms.map(function(m){return '<button class="chip" aria-pressed="'+(m.id===mid)+'" data-act="emach" data-v="'+esc(m.id)+'">'+esc(m.nome)+'</button>'}).join('')+'</div>'+
   '<div class="card"><div class="row"><div class="grow"><h2>Perguntas do checklist</h2><p class="small muted">'+items.length+' pergunta'+(items.length===1?'':'s')+'. As alterações valem na hora para os alunos.</p></div></div>'+

   {nome:'Juliana Reis',mat:'2026-0120',turma:'Design 2026.1',hab:{resina:'16/10/2026',fdm:'16/10/2026',bancada:'20/10/2026'}},
   {nome:'Rafael Nunes',mat:'2026-0133',turma:'Design 2026.1',hab:{}}];
  return Promise.all(ex.map(function(e){return pwS(e.mat,'1234').then(function(h){var st=Object.assign({id:slug(e.mat),pw:h,criado:now,exemplo:true},e);S.students=S.students.filter(function(x){return x.id!==st.id}).concat([st]);return Store.set('students/'+st.id,st)})})).then(function(){
    var m=cfg().machines.map(function(x){return x.id});
    var recs=[];
    if(m.indexOf('fdm')>-1)recs.push({id:'ex1',ts:now-1*day,aluno:'Juliana Reis',mat:'2026-0120',mid:'fdm',mnome:mach('fdm').nome,ok:7,nc:0,na:1,itens:(cfg().checks.fdm||[]).map(function(i,k){return {t:i.t,r:k===7?'na':'ok'}}),resolvido:false,exemplo:true});
    if(m.indexOf('resina')>-1)recs.push({id:'ex2',ts:now-2*day,aluno:'Mariana Souza',mat:'2026-0107',mid:'resina',mnome:mach('resina').nome,ok:7,nc:1,na:1,itens:(cfg().checks.resina||[]).map(function(i,k){var o={t:i.t,r:k===3?'nc':(k===8?'na':'ok')};if(k===3)o.obs='Marca de resíduo curado no canto esquerdo da cuba.';return o}),resolvido:false,exemplo:true});
    recs.forEach(function(r){S.records=[r].concat(S.records.filter(function(x){return x.id!==r.id}))});
    return Promise.all(recs.map(function(r){return Store.set('records/'+r.id,r)}));
  }).then(function(){toast('Exemplos carregados')});
}

/* ================= eventos ================= */
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  var f=ACT[b.dataset.act];if(!f)return;
  var r;try{r=f(b)}catch(err){console.warn(err)}
  render();
  if(r&&r.then)r.then(function(){render()},function(err){console.warn(err);toast('Algo deu errado. Tente de novo.')});
});
app.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset.f){
    if(t.dataset.f==='obs'){var it=(cfg().checks[S.mid]||[])[S.chk.idx];S.chk.obs[it.id]=t.value;var nb=document.getElementById('cnext');if(nb)nb.disabled=!(t.value.trim().length>0)}
    else S.form[t.dataset.f]=t.value;
  }
});
app.addEventListener('toggle',function(e){var d=e.target;if(d.tagName==='DETAILS'&&d.dataset.mid)S.open[d.dataset.mid]=d.open},true);
app.addEventListener('change',function(e){
  var t=e.target,ed=t.dataset&&t.dataset.ed;if(!ed)return;
  var mid=t.dataset.mid,v=t.value;
  if(ed==='q'){var c=cfg(),cm=curMach(),old=(c.checks[cm]||[]).find(function(i){return i.id===t.dataset.id});if(!v.trim()){t.value=old?old.t:'';return}var ch=Object.assign({},c.checks);ch[cm]=(c.checks[cm]||[]).map(function(i){return i.id===t.dataset.id?Object.assign({},i,{t:v.trim()}):i});guard(saveCfg({checks:ch}))}
  else if(ed==='lab'){guard(saveCfg({lab:v.trim()||'Laboratório Maker'}))}
  else if(ed==='appurl'){guard(saveCfg({appUrl:v.trim()}))}
  else if(ed==='m.nome'){editMachine(mid,function(m){return Object.assign({},m,{nome:v.trim()||m.nome})})}
  else if(ed==='m.tipo'){editMachine(mid,function(m){return Object.assign({},m,{tipo:v.trim()})})}
  else if(ed==='m.list'){var k=t.dataset.k;editMachine(mid,function(m){var o=Object.assign({},m);o[k]=v.split('\n').map(function(x){return x.trim()}).filter(Boolean);return o})}
  else if(ed==='qq.q'){editMachine(mid,function(m){return Object.assign({},m,{quiz:m.quiz.map(function(q,i){return i===+t.dataset.qi?Object.assign({},q,{q:v.trim()}):q})})})}
  else if(ed==='qq.o'){editMachine(mid,function(m){return Object.assign({},m,{quiz:m.quiz.map(function(q,i){if(i!==+t.dataset.qi)return q;var o=q.o.slice();o[+t.dataset.oi]=v.trim();return Object.assign({},q,{o:o})})})})}
  else if(ed==='qq.a'){editMachine(mid,function(m){return Object.assign({},m,{quiz:m.quiz.map(function(q,i){return i===+t.dataset.qi?Object.assign({},q,{a:+t.dataset.oi}):q})})})}
});
app.addEventListener('submit',function(e){
  e.preventDefault();var form=e.target.dataset.form,F=S.form;
  var done=function(p){Promise.resolve(p).then(function(){render()})};
  if(form==='login'){
    var mat=(F.lmat||'').trim(),pw=F.lpw||'';
    if(!mat||!pw)return setErr('Preencha a matrícula e a senha.');
    var st=S.students.find(function(x){return x.id===slug(mat)});
    if(!st)return setErr('Matrícula ou senha incorreta. Se é seu primeiro acesso, use a aba "Primeiro acesso".');
    return pwS(st.mat,pw).then(function(h){
      if(st.pw!==h)return setErr('Matrícula ou senha incorreta. Se é seu primeiro acesso, use a aba "Primeiro acesso".');
      S.sess.s=st.id;S.sess.a=null;saveSess();S.form={};S.err='';S.view='home';usePending();render();
    });
  }
  if(form==='register'){
    var nome=(F.nome||'').trim(),m2=(F.mat||'').trim(),turma=(F.turma||'').trim(),p1=F.pw||'',p2=F.pw2||'';
    if(!nome||!m2||!turma||!p1)return setErr('Preencha todos os campos.');
    if(nome.split(/\s+/).length<2)return setErr('Digite o nome completo.');
    if(!slug(m2).replace(/_/g,''))return setErr('Digite uma matrícula válida.');
    if(S.students.some(function(x){return x.id===slug(m2)}))return setErr('Essa matrícula já tem cadastro. Use a aba "Entrar".');
    if(p1.length<4)return setErr('A senha precisa ter pelo menos 4 caracteres.');
    if(p1!==p2)return setErr('As senhas não são iguais.');
    return pwS(m2,p1).then(function(h){
      var st={id:slug(m2),nome:nome,mat:m2,turma:turma,pw:h,hab:{},criado:Date.now()};
      S.students=S.students.concat([st]);S.sess.s=st.id;saveSess();S.form={};S.err='';S.view='home';usePending();render();toast('Conta criada');
      return guard(Store.set('students/'+st.id,st));
    });
  }
  if(form==='ilogin'){
    var u=(F.iuser||'').trim(),ip=F.ipw||'';
    if(!u||!ip)return setErr('Preencha o usuário e a senha.');
    return pwA(u,ip).then(function(h){
      var a=cfg().admins.find(function(x){return x.user.toLowerCase()===u.toLowerCase()});
      if(!a||a.pw!==h)return setErr('Usuário ou senha incorreta.');
      S.sess.a=a.id;S.sess.s=null;saveSess();S.form={};S.err='';S.itab='checklists';render();
    });
  }
  if(form==='qadd'){
    var q=(F.newq||'').trim();if(!q){var i=document.getElementById('newq');if(i)i.focus();return toast('Escreva a pergunta antes de adicionar')}
    var c=cfg(),mid=curMach(),ch=Object.assign({},c.checks);ch[mid]=(c.checks[mid]||[]).concat([{id:uid(),t:q}]);S.form.newq='';
    return done(guard(saveCfg({checks:ch}))),toast('Pergunta adicionada'),setTimeout(function(){var n=document.getElementById('newq');if(n)n.focus()},50);
  }
  if(form==='chpw'){
    S.errAt='pw';var a=adm();
    if(!F.pold||!F.pnew)return setErr('Preencha a senha atual e a nova senha.');
    return pwA(a.user,F.pold).then(function(h){
      if(h!==a.pw)return setErr('A senha atual está incorreta.');
      if(F.pnew.length<6)return setErr('A nova senha precisa ter pelo menos 6 caracteres.');
      if(F.pnew!==F.pnew2)return setErr('As senhas novas não são iguais.');
      if(F.pnew===F.pold)return setErr('Escolha uma senha diferente da atual.');
      return pwA(a.user,F.pnew).then(function(nh){
        var c=cfg();S.form={};S.err='';
        return guard(saveCfg({admins:c.admins.map(function(x){return x.id===a.id?Object.assign({},x,{pw:nh}):x})})).then(function(){toast('Senha alterada');render()});
      });
    });
  }
  if(form==='addadm'){
    S.errAt='adm';
    if(!F.nnome||!F.nuser||!F.npw)return setErr('Preencha nome, usuário e senha.');
    if(cfg().admins.some(function(x){return x.user.toLowerCase()===F.nuser.trim().toLowerCase()}))return setErr('Esse usuário já existe.');
    if(F.npw.length<6)return setErr('A senha precisa ter pelo menos 6 caracteres.');
    return pwA(F.nuser,F.npw).then(function(h){
      var c=cfg(),nome=F.nnome.trim(),user=F.nuser.trim();S.form={};S.err='';
      return guard(saveCfg({admins:c.admins.concat([{id:uid(),nome:nome,user:user,pw:h}])})).then(function(){toast('Instrutor cadastrado');render()});
    });
  }
});
window.addEventListener('hashchange',function(){parseHash();if(S.ready){usePending();render()}});

/* ================= início ================= */
function onSnap(){
  if(!S.ready){
    if(S.got.cfg&&S.got.stu&&S.got.rec){
      S.ready=true;
      try{var r=JSON.parse(lsGet('habilita:sessao')||'{}');S.sess={s:r.s||null,a:r.a||null}}catch(e){}
      if(S.sess.a&&adm())S.mode='instrutor';else S.sess.a=null;
      if(S.mode==='aluno'&&S.sess.s&&me())usePending();
      render();
    }
    return;
  }
  softRender();
}
(function start(){
  parseHash();
  render();
  sha('x');
  pwA('admin','habilita123').then(function(h){DEF_HASH=h;return Store.init()}).then(function(){
    Store.watch('config/main',function(d){S.cfgDoc=d;S.got.cfg=true;onSnap()});
    Store.watch('students',function(l){S.students=l;S.got.stu=true;onSnap()});
    Store.watch('records',function(l){S.records=l.slice().sort(function(a,b){return b.ts-a.ts});S.got.rec=true;onSnap()});
  });
})();
})();
